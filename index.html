<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>India AQI Predictor | Abhijeet</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{
  font-family:'Inter',sans-serif;
  background: linear-gradient(135deg,#667eea 0%,#764ba2 100%);
  min-height:100vh; display:flex; align-items:center; justify-content:center; margin:0; padding:20px;
}
.card{
  background:rgba(255,255,255,0.95); backdrop-filter:blur(10px);
  max-width:420px; width:100%; border-radius:24px; padding:30px 25px;
  box-shadow:0 20px 60px rgba(0,0,0,0.2); text-align:center;
}
h1{font-size:24px; margin:0 0 5px 0; color:#111;}
.sub{color:#666; font-size:14px; margin-bottom:20px;}
input{
  width:100%; box-sizing:border-box; padding:12px 16px; margin:8px 0;
  border:1.5px solid #e5e7eb; border-radius:12px; outline:none; font-size:14px;
}
input:focus{border-color:#667eea;}
button{
  width:100%; padding:14px; margin-top:15px; background:#111827; color:white;
  border:none; border-radius:12px; font-weight:600; font-size:15px; cursor:pointer;
  transition:0.2s;
}
button:hover{background:#000; transform:translateY(-1px);}
#result{
  margin-top:18px; padding:15px; border-radius:12px; display:none; font-weight:600;
}
.footer{margin-top:18px; font-size:11px; color:#9ca3af; pointer-events:none;}
  button{position:relative; z-index:10;}
.footer a{color:#667eea; text-decoration:none;}
</style>
</head>
<body>
<div class="card">
  <h1>🌿 India AQI Predictor</h1>
  <p class="sub">498 Cities Covered | MAE: 16.34 | RandomForest</p>
  
  <input type="number" id="co" placeholder="CO (e.g. 500)">
  <input type="number" id="nh3" placeholder="NH3 (e.g. 50)">
  <input type="number" id="no2" placeholder="NO2 (e.g. 30)">
  <input type="number" id="o3" placeholder="OZONE (e.g. 60)">
  <input type="number" id="pm10" placeholder="PM10 (e.g. 80)">
  <input type="number" id="so2" placeholder="SO2 (e.g. 20)">

  <button onclick="predict()">Predict PM2.5</button>
  <div id="result"></div>
  
  <div class="footer">
    Built by Abhijeet Kumar Mishra <a href="https://github.com/ab9560" target="_blank">GitHub</a> 
  </div>
</
